# Render Blueprint: one web service running the Dockerfile (game client + match server).
# Render provides PORT and supports WebSockets on all plans.
#
# Player accounts live in a free Neon Postgres database (DATABASE_URL), so they survive the
# free plan's restarts and redeploys. Without DATABASE_URL the server falls back to a local
# SQLite file, which the free plan wipes on every restart.
#
# Deploy: in Render choose New + -> Blueprint -> pick this repo, then paste your Neon
# connection string when Render asks for DATABASE_URL.
services:
  - type: web
    name: aerial-arena
    runtime: docker
    plan: free # sleeps after ~15 min idle; first visit after that takes ~30-60 s to wake
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /app/data
      - key: DATABASE_URL
        sync: false # secret: entered in the Render dashboard, never committed
